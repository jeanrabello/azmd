appId: com.jeanrabello.azmd
productName: azmd
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  # tray.ts procura os ícones em <resources>/icons quando empacotado.
  - from: resources/icons
    to: icons

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Hardened runtime é pré-requisito para notarização.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Agente de menu bar: sem ícone no Dock, sem janela principal.
    LSUIElement: true
    NSSupportsAutomaticGraphicsSwitching: true
    # Nome que o macOS mostra em Itens de Início de Sessão e no Finder.
    # Sem isto o app aparecia como "Electron" ao ligar "iniciar com o login".
    CFBundleName: azmd
    CFBundleDisplayName: azmd

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Sem certificado de code signing, o SmartScreen avisa na primeira execução.
  # Para assinar de verdade: definir CSC_LINK e CSC_KEY_PASSWORD no ambiente.

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # O app é um agente de bandeja: um atalho no menu Iniciar basta, e o ícone na
  # área de trabalho seria ruído para algo que vive na system tray.
  createDesktopShortcut: false
  createStartMenuShortcut: true

# Sem Developer ID, o electron-builder deixa a assinatura herdada do binário
# do Electron, cujo identifier é "Electron" — e é esse nome que o macOS mostra
# em Itens de Início de Sessão. O script reassina ad-hoc com o appId correto.
# Para notarizar de verdade: definir APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e
# APPLE_TEAM_ID, obter um certificado Developer ID e ligar `notarize: true`.
afterSign: scripts/adhoc-sign.cjs
